spring:
  application:
    name: opay-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/OPAY
    username: root
    password: 9498
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: opay-secret-key-for-jwt-token-generation-please-change-in-production
  access-token-expiration: 3600000 # 1 hour (milliseconds)
  refresh-token-expiration: 604800000 # 7 days (milliseconds)

logging:
  level:
    com.opay: DEBUG
    org.springframework.security: DEBUG
